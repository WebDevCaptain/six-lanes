# Static host for the Parquet lake.
#
# Two properties matter and both are asserted by tests:
#   1. HTTP range requests (206 + Content-Range). Without them DuckDB downloads
#      whole files and every "bytes read" number becomes a lie.
#   2. CORS, including Access-Control-Expose-Headers, so a browser tab can read
#      Content-Range off the response.
#
# nginx serves ranges out of the box; the CORS headers are the only thing to add.

server {
    listen 80;
    server_name _;

    root /srv/lake;
    autoindex on;

    # Parquet is already zstd-compressed; gzip on top wastes CPU and, worse,
    # makes nginx drop range support for the compressed response.
    gzip off;

    location / {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "*" always;
        add_header Accept-Ranges "bytes" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri $uri/ =404;
    }
}
