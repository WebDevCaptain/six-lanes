name: ci

on:
  push:
    branches: [main]
  pull_request:

# The whole pipeline on the reference dataset. Not to publish timings from a shared
# runner, which would be noise, but to prove the claims still hold: the lanes agree,
# the SCD2 invariants hold, pruning prunes, and the slice fits its budget.
#
# The reference size rather than a token one, because DEFAULT_PARAMS names a specific
# order id that only exists at that size. Shrink the dataset and Q7 asks for an order
# nobody has, which every lane answers with nothing and agrees about. `pnpm load`
# refuses to proceed in that state, so CI would fail rather than pass emptily.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap and independent of any service: fail here before spending on containers.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Start Postgres and the lake host
        run: pnpm services

      - name: Build the dataset and every store the lanes read
        run: |
          pnpm generate
          pnpm load
          pnpm ducklake
          pnpm slice

      # The gate: every lane must return identical rows, or this exits non-zero.
      - run: pnpm compare
      - run: pnpm test:integration

      - name: Build the app
        run: pnpm build

      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100
